server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    etag off;
    if_modified_since off;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = / {
        rewrite ^ /index.html last;
    }

    location ~ ^/(skills|workflows|project-templates)/ {
        types { }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location / {
        types {
            text/html html;
            text/css css;
            application/javascript js mjs;
            application/json json;
        }
        charset utf-8;
        try_files $uri =404;
    }
}
