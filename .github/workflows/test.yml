name: Skills Hub tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        powershell: [powershell.exe, pwsh.exe]
    env:
      SKILLS_HUB_POWERSHELL: ${{ matrix.powershell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test -- --test-name-pattern=PowerShell
